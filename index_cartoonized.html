<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cartoonization</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body {
            background: #f8f9fa;
        }
        .navbar {
            background: #343a40;
        }
        .navbar-brand {
            color: #ffffff !important;
            font-weight: bold;
        }
        .card {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        footer {
            background: #343a40;
            color: #fff;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Cartoonizer</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h2 class="text-center mb-4">Cartoonize Your Image</h2>
                    
                    <!-- Upload Form -->
                    <form action="/cartoonize" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="imageUpload" class="form-label">Upload an Image</label>
                            <input class="form-control" type="file" id="imageUpload" name="image" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Cartoonize</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Cartoonized Image Output -->
        {% if cartoonized_image %}
        <div class="row justify-content-center mt-4">
            <div class="col-md-6 text-center">
                <h3>Cartoonized Image</h3>
                <img src="{{ cartoonized_image }}" class="img-fluid rounded shadow mt-2" alt="Cartoonized Image">
                <div class="mt-3">
                    <a href="{{ cartoonized_image }}" download="cartoonized_image.png" class="btn btn-success">Download Image</a>
                </div>
            </div>
        </div>
        {% endif %}

        <!-- Intermediate Steps Display -->
        {% if intermediate_images %}
        <div class="mt-5">
            <h3 class="text-center">Transformation Steps</h3>
            <div class="row justify-content-center">
                {% for step, image_url in intermediate_images.items() %}
                <div class="col-md-4 text-center">
                    <h5>{{ step }}</h5>
                    <img src="{{ image_url }}" class="img-fluid rounded shadow mt-2" alt="{{ step }}">
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2025 Cartoonizer | Created with ❤️</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
